name: SPARK PR checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: spark-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate historical POB calibration fixtures without API calls
        run: |
          node --check tools/pob-jan2026-calibrate.mjs
          node tools/pob-jan2026-calibrate.mjs --validate
          node --check tools/calibrate-pob-owner-p2.mjs
          node tools/calibrate-pob-owner-p2.mjs --plan

      - name: Run regression tests
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
          REACT_APP_VAPID_PUBLIC_KEY: ${{ secrets.REACT_APP_VAPID_PUBLIC_KEY }}
          REACT_APP_ENABLE_PHYSICS: "true"

      - name: Verify historical POB canary controls in isolated PostgreSQL
        run: node tools/test-pob-historical-queue.mjs

      - name: Verify marking database and build worker
        run: npm run test:marking-db && npm run build:marker

      - name: Verify V2 private grading migrations in isolated PostgreSQL
        run: node tools/test-marking-v2-database.mjs

      - name: Verify complete V2 activation, worker leases and score boundaries
        run: node tools/test-marking-v2-release-gates.mjs

      - name: Bundle nine-subject deterministic server V2 examiner
        run: |
          npm run build:marker:v2
          node --check supabase/functions/_shared/server-marker-v2.mjs
          node --input-type=module -e "import('./supabase/functions/_shared/server-marker-v2.mjs').then(x => { if(typeof x.evaluateExistingSubjectPaper2V2 !== 'function') process.exit(1) })"

      - name: Upload verified server marking bundle
        uses: actions/upload-artifact@v4
        with:
          name: spark-server-marker-${{ github.sha }}
          path: |
            supabase/functions/_shared/server-marker.mjs
            supabase/functions/_shared/server-marker.sha256
            supabase/functions/_shared/server-marker-v2.mjs
            supabase/functions/_shared/server-marker-v2.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish checked V2 marker bundle for private Edge deployment
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TEMP_DIR="$(mktemp -d)"
          mkdir -p "$TEMP_DIR/bundled"
          cp supabase/functions/_shared/server-marker-v2.mjs "$TEMP_DIR/bundled/server-marker-v2.mjs"
          cp supabase/functions/_shared/server-marker-v2.sha256 "$TEMP_DIR/bundled/server-marker-v2.sha256"
          git -C "$TEMP_DIR" init -q
          git -C "$TEMP_DIR" config user.name "github-actions[bot]"
          git -C "$TEMP_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$TEMP_DIR" add bundled
          git -C "$TEMP_DIR" commit -qm "Compiled V2 examiner bundle from ${GITHUB_SHA}"
          git -C "$TEMP_DIR" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$TEMP_DIR" push origin HEAD:"refs/heads/artifacts/v2-marker-${GITHUB_SHA}"

      - name: Build SPARK
        run: npm run build
        env:
          CI: false
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
          REACT_APP_VAPID_PUBLIC_KEY: ${{ secrets.REACT_APP_VAPID_PUBLIC_KEY }}
          REACT_APP_ENABLE_PHYSICS: "true"
