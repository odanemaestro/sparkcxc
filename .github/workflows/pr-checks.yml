name: SPARK PR checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: spark-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate historical POB calibration fixtures without API calls
        run: |
          node --check tools/pob-jan2026-calibrate.mjs
          node tools/pob-jan2026-calibrate.mjs --validate
          node --check tools/calibrate-pob-owner-p2.mjs
          node tools/calibrate-pob-owner-p2.mjs --plan

      - name: Run regression tests
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
          REACT_APP_VAPID_PUBLIC_KEY: ${{ secrets.REACT_APP_VAPID_PUBLIC_KEY }}
          REACT_APP_ENABLE_PHYSICS: "true"

      - name: Verify historical POB canary controls in isolated PostgreSQL
        run: node tools/test-pob-historical-queue.mjs

      - name: Verify marking database and build worker
        run: npm run test:marking-db && npm run build:marker

      - name: Verify private V2 worker service authentication
        run: node --test tools/test-v2-worker-auth.mjs

      - name: Verify V2 private grading migrations in isolated PostgreSQL
        run: node tools/test-marking-v2-database.mjs

      - name: Verify complete V2 activation, worker leases and score boundaries
        run: node tools/test-marking-v2-release-gates.mjs

      - name: Bundle nine-subject deterministic server V2 examiner
        run: |
          npm run build:marker:v2
          node --check supabase/functions/_shared/server-marker-v2.mjs
          node tools/test-v2-registered-paper-replay.mjs
          node --input-type=module -e "import('./supabase/functions/_shared/server-marker-v2.mjs').then(x => { if(typeof x.evaluateExistingSubjectPaper2V2 !== 'function') process.exit(1) })"

      - name: Recheck Physics criterion evidence and source-table fixtures
        run: |
          node tools/v2-verify-all.mjs --subject physics --out artifacts/v2-physics-table-retest
          node --input-type=module -e 'import fs from "node:fs";const s=JSON.parse(fs.readFileSync("artifacts/v2-physics-table-retest/summary.json","utf8"));const p=s.bySubject.physics;if(p?.criteria!==135||p.verified<57) {console.error("Physics verification regressed",JSON.stringify(p));process.exit(1)}console.log("Physics verified",p.verified,"of 135; remaining criteria stay unreleased")'

      - name: Verify real Physics V2 publication with production method tags
        run: |
          node tools/test-v2-release-e2e.mjs artifacts/v2-physics-table-retest --subject physics --paper spark-phy-p02-practice-4

      - name: Report each unverified Physics source criterion
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const rows=JSON.parse(fs.readFileSync("artifacts/v2-physics-table-retest/evidence.json","utf8"));
          const missing=rows.filter(x=>x.outcome!=="verified");
          console.log("Physics failed source criteria:",missing.length);
          for(const r of missing){
           const problems=[...(r.missingClasses||[]).map(x=>"missing:"+x),
             ...(r.uncommittedClasses||[]).map(x=>"uncommitted:"+x),
             ...(r.failures||[]).map(f=>f.cls+":"+f.failures.map(x=>x).join(","))];
           console.log(JSON.stringify({criterion:r.criterionId,marks:r.maxMarks,kind:r.kind,
            problems,partial:r.cases?.filter(x=>x.cls==="partial").map(x=>({marks:x.marks,expect:x.expect,resolved:x.resolved})),
            incorrect:r.cases?.filter(x=>x.cls==="incorrect").map(x=>({marks:x.marks,expect:x.expect,resolved:x.resolved})),
            full:r.cases?.filter(x=>x.cls==="full").map(x=>({marks:x.marks,expect:x.expect,resolved:x.resolved}))}));
          }
          NODE

      - name: Publish source-verified Physics evidence for review
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TEMP_DIR="$(mktemp -d)"
          mkdir -p "$TEMP_DIR/verified"
          node --input-type=module -e 'import fs from "node:fs";const a=JSON.parse(fs.readFileSync("artifacts/v2-physics-table-retest/evidence.json","utf8"));fs.writeFileSync(process.argv[1],JSON.stringify(a.filter(x=>x.outcome==="verified")));' "$TEMP_DIR/verified/physics-evidence.json"
          git -C "$TEMP_DIR" init -q
          git -C "$TEMP_DIR" config user.name "github-actions[bot]"
          git -C "$TEMP_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$TEMP_DIR" add verified
          git -C "$TEMP_DIR" commit -qm "Automated source-verification evidence for ${GITHUB_SHA}"
          git -C "$TEMP_DIR" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$TEMP_DIR" push origin HEAD:"refs/heads/artifacts/physics-verified-${GITHUB_SHA}"

      - name: Upload Physics V2 evidence results
        uses: actions/upload-artifact@v4
        with:
          name: spark-v2-physics-retest-${{ github.sha }}
          path: artifacts/v2-physics-table-retest/
          if-no-files-found: error
          retention-days: 30

      - name: Reverify all 252 IT criteria and nine paper-level submissions
        run: |
          node tools/v2-verify-all.mjs --subject information-technology --out artifacts/v2-it-production-retest
          node --input-type=module -e 'import fs from "node:fs"; const x=JSON.parse(fs.readFileSync("artifacts/v2-it-production-retest/summary.json","utf8")); const it=x.bySubject["information-technology"]; if(it?.criteria!==252 || it.verified!==252 || x.papers?.verified!==9 || x.rehearsal?.criteriaRejected?.length || x.rehearsal?.papersRejected?.length) {console.error("IT release source QA incomplete",JSON.stringify({it,papers:x.papers,rehearsal:x.rehearsal}));process.exit(1)} console.log("IT source-verification and paper-release matrix clean: 252 criteria, 9 papers")'

      - name: Upload current IT production-regression evidence
        uses: actions/upload-artifact@v4
        with:
          name: spark-v2-it-retest-${{ github.sha }}
          path: artifacts/v2-it-production-retest/
          if-no-files-found: error
          retention-days: 30

      - name: Upload private V2 criterion evidence QA report
        uses: actions/upload-artifact@v4
        with:
          name: spark-v2-criterion-evidence-${{ github.sha }}
          path: |
            artifacts/v2-criterion-evidence-audit.json
            artifacts/v2-criterion-qa-all-2063.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload verified server marking bundle
        uses: actions/upload-artifact@v4
        with:
          name: spark-server-marker-${{ github.sha }}
          path: |
            supabase/functions/_shared/server-marker.mjs
            supabase/functions/_shared/server-marker.sha256
            supabase/functions/_shared/server-marker-v2.mjs
            supabase/functions/_shared/server-marker-v2.sha256
            supabase/functions/_shared/server-marker-v2-checksum.mjs
          if-no-files-found: error
          retention-days: 7

      - name: Publish checked V2 marker bundle for private Edge deployment
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TEMP_DIR="$(mktemp -d)"
          mkdir -p "$TEMP_DIR/bundled"
          cp supabase/functions/_shared/server-marker-v2.mjs "$TEMP_DIR/bundled/server-marker-v2.mjs"
          cp supabase/functions/_shared/server-marker-v2.sha256 "$TEMP_DIR/bundled/server-marker-v2.sha256"
          cp supabase/functions/_shared/server-marker-v2-checksum.mjs "$TEMP_DIR/bundled/server-marker-v2-checksum.mjs"
          git -C "$TEMP_DIR" init -q
          git -C "$TEMP_DIR" config user.name "github-actions[bot]"
          git -C "$TEMP_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$TEMP_DIR" add bundled
          git -C "$TEMP_DIR" commit -qm "Compiled V2 examiner bundle from ${GITHUB_SHA}"
          git -C "$TEMP_DIR" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$TEMP_DIR" push origin HEAD:"refs/heads/artifacts/v2-marker-${GITHUB_SHA}"

      - name: Build SPARK
        run: npm run build
        env:
          CI: false
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
          REACT_APP_VAPID_PUBLIC_KEY: ${{ secrets.REACT_APP_VAPID_PUBLIC_KEY }}
          REACT_APP_ENABLE_PHYSICS: "true"
