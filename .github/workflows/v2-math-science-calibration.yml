name: V2 Mathematics and Science criterion calibration
on:
  pull_request:
    branches: [main]
    paths:
      - "src/grading/**"
      - "src/practice/**"
      - "src/integratedScience/**"
      - "tools/v2-verify-all.mjs"
      - "tools/report-v2-criterion-gaps.mjs"
      - "supabase/migrations/**"
      - ".github/workflows/v2-math-science-calibration.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Mathematics source-bound criterion verification
        run: |
          node tools/v2-verify-all.mjs --subject mathematics --out artifacts/v2-math-calibration
          node tools/report-v2-criterion-gaps.mjs artifacts/v2-math-calibration
      - name: Integrated Science source-bound criterion verification
        run: |
          node tools/v2-verify-all.mjs --subject integrated-science --out artifacts/v2-science-calibration
          node tools/report-v2-criterion-gaps.mjs artifacts/v2-science-calibration
      - name: Print only newly verified criteria for source-bound registration
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const ids=new Set([
            "p2-q2-v2::a","p2-q2-v2::b1",
            "IS-M2-P2-08::(b)::(i)","IS-M2-P2-14::(c)::(i)"
          ]);
          const files=[
            "artifacts/v2-math-calibration/evidence.json",
            "artifacts/v2-science-calibration/evidence.json"
          ];
          const hits=files.flatMap(f=>JSON.parse(fs.readFileSync(f,"utf8")))
            .filter(r=>ids.has(r.criterionId)&&r.outcome==="verified");
          if(hits.length!==ids.size)throw Error(
            "One or more expected new criteria have not passed verification");
          console.log("V2_REGISTERABLE_RECORDS="+JSON.stringify(hits));
          // Emit only the six newly source-verified Mathematics criteria. The
          // production registration RPC validates each source and evidence SHA.
          const newlyApprovedIds=new Set([
            "p2e-q4::b","p2g-q4::b","p2i-q4::b",
            "p2f-q8::a","p2h-q8::a","p2j-q8::a"
          ]);
          const mathRecords=JSON.parse(fs.readFileSync("artifacts/v2-math-calibration/evidence.json","utf8"))
            .filter(r=>newlyApprovedIds.has(r.criterionId));
          if(mathRecords.length!==newlyApprovedIds.size||
             mathRecords.some(r=>r.outcome!=="verified"||
               r.provenance?.workingTreeDirty!==false))
            throw Error("Six Mathematics source-bound approvals must pass and be clean");
          console.log("V2_MATH_REGISTERABLE_RECORDS="+JSON.stringify(mathRecords));
          // Exact registered full working unlocked these 57 source-specific
          // M/A/B partial-credit criteria. Export only clean, verified records
          // for the existing private DB function to validate and register.
          const bulkIds=new Set(["p2e-q2::b2","p2e-q6::a","p2e-q6::b","p2e-q6::d","p2e-q7::c","p2e-q8::d","p2e-q8::e","p2e-q9::a","p2e-q9::b","p2e-q9::c","p2f-q10::a2","p2f-q10::b","p2f-q2::a","p2f-q3::a","p2f-q4::c2","p2f-q6::b","p2f-q9::a","p2f-q9::b","p2f-q9::c","p2g-q2::b2","p2g-q6::a","p2g-q6::b","p2g-q6::d","p2g-q7::c","p2g-q8::d","p2g-q8::e","p2g-q9::a","p2g-q9::b","p2g-q9::c","p2h-q10::a2","p2h-q10::b","p2h-q2::a","p2h-q3::a","p2h-q4::c2","p2h-q6::b","p2h-q9::a","p2h-q9::b","p2h-q9::c","p2i-q2::b2","p2i-q6::a","p2i-q6::b","p2i-q6::d","p2i-q7::c","p2i-q8::d","p2i-q8::e","p2i-q9::a","p2i-q9::b","p2i-q9::c","p2j-q10::a2","p2j-q10::b","p2j-q2::a","p2j-q3::a","p2j-q4::c2","p2j-q6::b","p2j-q9::a","p2j-q9::b","p2j-q9::c"]);
          const bulkRecords=JSON.parse(fs.readFileSync("artifacts/v2-math-calibration/evidence.json","utf8"))
            .filter(r=>bulkIds.has(r.criterionId));
          if(bulkRecords.length!==bulkIds.size||
             bulkRecords.some(r=>r.outcome!=="verified"||
                r.provenance?.workingTreeDirty!==false||
                !r.evidenceSha256||!r.sourceSha256||!r.criterionSha256))
            throw Error("Source-bound 57-criterion Mathematics batch was not fully verified");
          // Only source-verified geometry reasoning records can be registered.
          const geometryIds=new Set(["p2e-q6::c","p2f-q6::c","p2g-q6::c",
            "p2h-q6::c","p2i-q6::c","p2j-q6::c"]);
          const geometryRecords=JSON.parse(fs.readFileSync("artifacts/v2-math-calibration/evidence.json","utf8"))
            .filter(r=>geometryIds.has(r.criterionId));
          if(geometryRecords.length!==6||
             geometryRecords.some(r=>r.outcome!=="verified"||
               r.provenance?.workingTreeDirty!==false||
               !r.evidenceSha256||!r.sourceSha256||!r.criterionSha256))
            throw Error("Geometry reasoning approval evidence is not complete");
          for(const record of geometryRecords)
            console.log("V2_GEOMETRY_APPROVAL_ITEM="+JSON.stringify(record));
          // Source-authored currency, graph-profit and rearrangement checks.
          // Export only the exact clean records actually passing the examiner.
          const calibrationIds=new Set(["p2f-q1::b1","p2h-q1::b1","p2j-q1::b1","p2f-q8::c","p2h-q8::c","p2j-q8::c","p2f-q8::d","p2h-q8::d","p2j-q8::d","p2f-q2::c","p2h-q2::c","p2j-q2::c"]);
          const nextRecords=JSON.parse(fs.readFileSync("artifacts/v2-math-calibration/evidence.json","utf8"))
            .filter(r=>calibrationIds.has(r.criterionId));
          if(nextRecords.length!==12||new Set(nextRecords.map(r=>r.criterionId)).size!==12||
             nextRecords.some(r=>r.outcome!=="verified"||
               r.provenance?.workingTreeDirty!==false||
               !r.evidenceSha256||!r.sourceSha256||!r.criterionSha256))
            throw Error("12 new Mathematics source-verified criteria not proven");
          for(const record of nextRecords)
            console.log("V2_SOURCE_MATH_12_ITEM="+JSON.stringify(record));
          // Historical manual table rubric rows are eligible ONLY after
          // keyed, source-specific full/partial/wrong/equivalent/blank checks.
          const sourceTableIds=new Set(["p2e-q5::a","p2f-q5::a","p2g-q5::a","p2h-q5::a","p2i-q5::a","p2j-q5::a","p2e-q7::a","p2f-q7::a","p2g-q7::a","p2h-q7::a","p2i-q7::a","p2j-q7::a","p2e-q8::a","p2g-q8::a","p2i-q8::a"]);
          const sourceTableRows=JSON.parse(fs.readFileSync("artifacts/v2-math-calibration/evidence.json","utf8"))
            .filter(record=>sourceTableIds.has(record.criterionId));
          if(sourceTableRows.length!==15||
             new Set(sourceTableRows.map(r=>r.criterionId)).size!==15||
             sourceTableRows.some(r=>r.outcome!=="verified"||
               r.provenance?.workingTreeDirty!==false||
               !r.sourceSha256||!r.criterionSha256||!r.evidenceSha256))
            throw Error("Do not approve unverified Mathematics source table evidence");
          for(const record of sourceTableRows)
            console.log("V2_SOURCE_TABLE_15_ITEM="+JSON.stringify(record));
          // Graph B marks are registered ONLY with complete source-scoped
          // adversarial verification evidence, including A/B label conflicts.
          const sourceGraphIds=new Set(["p2e-q3::a","p2g-q3::a","p2i-q3::a","p2e-q8::b","p2g-q8::b","p2i-q8::b"]);
          const sourceGraphRecords=JSON.parse(fs.readFileSync("artifacts/v2-math-calibration/evidence.json","utf8"))
            .filter(record=>sourceGraphIds.has(record.criterionId));
          if(sourceGraphRecords.length!==6||
             new Set(sourceGraphRecords.map(r=>r.criterionId)).size!==6||
             sourceGraphRecords.some(r=>r.outcome!=="verified"||
               r.provenance?.workingTreeDirty!==false||
               !r.sourceSha256||!r.criterionSha256||!r.evidenceSha256))
             throw Error("Mathematics graph source verification incomplete");
          for(const record of sourceGraphRecords)
            console.log("V2_SOURCE_GRAPH_6_ITEM="+JSON.stringify(record));
          // Independently prove exact source and criterion hashes for the
          // original F/H/J cumulative-frequency graphs before DB registration.
          const ogiveIds=new Set(["p2f-q5::b","p2h-q5::b","p2j-q5::b"]);
          const ogiveRecords=JSON.parse(fs.readFileSync("artifacts/v2-math-calibration/evidence.json","utf8"))
            .filter(r=>ogiveIds.has(r.criterionId));
          if(ogiveRecords.length!==3||
             new Set(ogiveRecords.map(r=>r.criterionId)).size!==3||
             ogiveRecords.some(r=>r.outcome!=="verified"||
                r.provenance?.workingTreeDirty!==false||
                !r.evidenceSha256||!r.sourceSha256||!r.criterionSha256))
            throw Error("Original source frequency graph evidence incomplete");
          for(const record of ogiveRecords)
            console.log("V2_SOURCE_OGIVE_3_ITEM="+JSON.stringify(record));
          const constructionIds=new Set(["p2-q3-v9::a","p2-q3-v10::a"]);
          const constructionRecords=JSON.parse(fs.readFileSync("artifacts/v2-math-calibration/evidence.json","utf8"))
            .filter(r=>constructionIds.has(r.criterionId));
          if(constructionRecords.length!==2||
             new Set(constructionRecords.map(r=>r.criterionId)).size!==2||
             constructionRecords.some(r=>r.outcome!=="verified"||
                r.provenance?.workingTreeDirty!==false||
                !r.evidenceSha256||!r.sourceSha256||!r.criterionSha256))
            throw Error("Original Mathematics Q3 ruler/compass evidence is unverified");
          for(const record of constructionRecords)
            console.log("V2_SOURCE_CONSTRUCTION_2_ITEM="+JSON.stringify(record));
          // E-J ruler/compass geometry: no approvals without nine complete,
          // clean and source-hashed original construction response fixtures.
          const padIds=new Set([
            "p2e-q4::a1","p2f-q4::a1","p2f-q4::a2",
            "p2g-q4::a1","p2h-q4::a1","p2h-q4::a2",
            "p2i-q4::a1","p2j-q4::a1","p2j-q4::a2"
          ]);
          const padRecords=JSON.parse(fs.readFileSync("artifacts/v2-math-calibration/evidence.json","utf8"))
            .filter(r=>padIds.has(r.criterionId));
          if(padRecords.length!==padIds.size||
             new Set(padRecords.map(r=>r.criterionId)).size!==padIds.size||
             padRecords.some(r=>r.outcome!=="verified"||
                r.provenance?.workingTreeDirty!==false||
                !r.evidenceSha256||!r.sourceSha256||!r.criterionSha256||
                r.cases.some(x=>!x.passed)))
             throw Error("Nine E-J original compass constructions lack complete source proof");
          for(const record of padRecords)
            console.log("V2_SOURCE_EJ_PAD_9_ITEM="+JSON.stringify(record));
          console.log("V2_LARGE_MATH_VERIFIED_COUNT="+bulkRecords.length);
          for(const record of bulkRecords)
            console.log("V2_LARGE_MATH_EVIDENCE_ITEM="+JSON.stringify(record));
          NODE
      - name: Upload complete evidence and failure reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-math-science-criterion-calibration
          path: |
            artifacts/v2-math-calibration/
            artifacts/v2-science-calibration/
          if-no-files-found: warn
