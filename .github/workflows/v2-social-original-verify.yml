name: V2 Social Studies 48-part source verification
on:
  pull_request:
    branches: [main]
    paths:
      - "src/grading/**"
      - "src/socialStudies/**"
      - "tools/v2-verify-all.mjs"
      - ".github/workflows/v2-social-original-verify.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Verify all Social Studies source criteria against real V2 server grader
        run: node tools/v2-verify-all.mjs --subject social-studies --out artifacts/v2-social-original
      - name: Report every structured criterion and enforce all 48
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const records=JSON.parse(fs.readFileSync("artifacts/v2-social-original/evidence.json","utf8"));
          const structured=records.filter(r=>!r.criterionId.endsWith("::content")&&!r.criterionId.endsWith("::organisation"));
          const verified=structured.filter(r=>r.outcome==="verified");
          console.log("SOCIAL_V2_COUNTS="+JSON.stringify({total:records.length,
           structured:structured.length,verified:verified.length,
           unsuccessful:structured.filter(r=>r.outcome!=="verified").map(r=>({
            id:r.criterionId,outcome:r.outcome,blocker:r.blocker,
            failures:r.failures,uncommitted:r.uncommittedClasses
           })).slice(0,48),
           provenanceFails:verified.filter(r=>r.provenance?.workingTreeDirty!==false||
             !r.sourceSha256||!r.criterionSha256||!r.evidenceSha256||
             r.cases?.some(x=>!x.passed)).map(r=>r.criterionId)
          }));
          if(structured.length!==48||verified.length!==48||
             verified.some(r=>r.provenance?.workingTreeDirty!==false||
              !r.sourceSha256||!r.criterionSha256||!r.evidenceSha256||
              r.cases?.some(x=>!x.passed)))
           throw Error("Unverified source-bound Social Studies criteria remain");
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: social-v2-source-48-evidence
          path: artifacts/v2-social-original/
          if-no-files-found: error
  evidence:
    name: Export source evidence (${{ matrix.paper }})
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        paper: ["ss-p2-original-A", "ss-p2-original-B", "ss-p2-original-C"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: social-v2-source-48-evidence
          path: artifacts/v2-social-original/
      - name: Export all source-bound verified records for this paper
        env:
          SOURCE_PAPER: ${{ matrix.paper }}
        run: |
          node <<'NODE'
          const fs=require("fs");
          const all=JSON.parse(fs.readFileSync("artifacts/v2-social-original/evidence.json","utf8"));
          const records=all.filter(r=>r.paperId===process.env.SOURCE_PAPER&&r.outcome==="verified");
          console.log("SOCIAL_APPROVAL_PAPER="+process.env.SOURCE_PAPER+" records="+records.length);
          if(records.length!==16)throw Error("Missing verified source evidence for this paper");
          for(const r of records)console.log("SOCIAL_APPROVAL_ITEM="+JSON.stringify(r));
          NODE
