<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
<!--
  Done by: Odane Robinson
  QA fix: the original diagram placed N and Q well INSIDE the circle
  (120px and 131px from the centre, when the radius is 170px), so the
  points labelled "on the circumference" were not actually on the circle.
  It also had a stray 5th, unlabelled vertex that turned the LQ chord into
  a two-segment kink. Both points are now placed by solving for the exact
  63 deg tangent-chord angle at L and reflecting L about diameter ON so
  that LN = NQ, as the question requires.
-->
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#162033}
.label{font-size:18px;font-weight:600}
.small{font-size:15px}
.line{stroke:#162033;stroke-width:3;fill:none}
.thin{stroke:#162033;stroke-width:2;fill:none}
</style>
<rect width="900" height="560" fill="white"/>
<circle cx="450" cy="260" r="170" fill="white" stroke="#162033" stroke-width="3"/>
<line x1="450" y1="90" x2="450" y2="430" class="thin"/>
<line x1="300" y1="430" x2="600" y2="430" class="line"/>
<line x1="450" y1="430" x2="312.6" y2="159.8" class="line"/>
<line x1="312.6" y1="159.8" x2="611.9" y2="208.0" class="line"/>
<line x1="611.9" y1="208.0" x2="450" y2="430" class="line"/>
<circle cx="450" cy="260" r="3" fill="#162033"/>
<text x="438" y="252" class="small">O</text>
<text x="442" y="78" class="label">P</text>
<text x="620" y="205" class="label">Q</text>
<text x="290" y="150" class="label">N</text>
<text x="438" y="455" class="label">L</text>
<text x="270" y="455" class="label">M</text>
<text x="605" y="455" class="label">R</text>
<text x="382" y="410" class="small">63°</text>
<text x="330" y="270" class="small">x</text>
<text x="470" y="330" class="small">y</text>
</svg>
