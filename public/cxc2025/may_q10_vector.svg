<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
<!--
  Done by: Odane Robinson
  QA fix: the original shape was an isosceles TRAPEZOID (its two "parallel"
  sides PQ and OL had different lengths, 270px vs 440px, and OP was not
  parallel to LQ at all), even though the question states OPQL is a
  PARALLELOGRAM. Q is now placed at O + vector(OP) + vector(OL), which is
  the only position that makes OP=LQ and PQ=OL simultaneously. M (on PL,
  ratio PM:ML = 2:1) and T (with PQ=QT, so Q is the midpoint of PT) are
  placed exactly, not estimated.
-->
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#162033}
.label{font-size:18px;font-weight:600}
.small{font-size:15px}
.line{stroke:#162033;stroke-width:3;fill:none}
</style>
<rect width="900" height="560" fill="white"/>
<path d="M140 410 L195 190 L485 190 L430 410 Z" fill="#f8fafc" stroke="#162033" stroke-width="3"/>
<line x1="195" y1="190" x2="430" y2="410" class="line"/>
<line x1="430" y1="410" x2="775" y2="190" class="line"/>
<line x1="485" y1="190" x2="775" y2="190" stroke="#6b7280" stroke-width="2" stroke-dasharray="6,4"/>
<circle cx="351.7" cy="336.7" r="7" fill="#162033"/>
<text x="125" y="435" class="label">O</text>
<text x="180" y="178" class="label">P</text>
<text x="490" y="178" class="label">Q</text>
<text x="435" y="435" class="label">L</text>
<text x="785" y="178" class="label">T</text>
<text x="360" y="330" class="label">M</text>
<text x="150" y="300" class="label">r</text>
<text x="290" y="435" class="label">s</text>
</svg>
