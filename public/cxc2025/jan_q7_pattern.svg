  fixed offsets with gaps between them), so all three looked identical even
  though the question states they have different dot/line totals
  (D = 5, 8, 11 and L = 8, 15, 22). Below, each diagram is a real chain of
  n unit squares (with diagonals, a centre spoke and a centre dot per
  square) sharing edges with its neighbour. Dot and line counts were
  verified programmatically to match D(n) = 3n+2 and L(n) = 7n+1 exactly
  for n = 1..4, so Diagram n genuinely has the stated number of dots and
  lines - this is an original, verified diagram, not a reproduction of the
  exact exam artwork, which was not available to check against.
-->
