<line x1="394.0" y1="226.8" x2="394.0" y2="70" class="line"/><path d="M394.0 60l-8 16h16z" fill="#162033"/><text x="409" y="80" class="label">North</text>
<text x="200" y="445" class="label">A</text><text x="352" y="200" class="label">B</text><text x="628" y="440" class="label">C</text>
