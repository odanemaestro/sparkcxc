.small{font-size:15px}
.line{stroke:#162033;stroke-width:3;fill:none}
</style>
<rect width="900" height="560" fill="white"/>
<line x1="220" y1="420" x2="220" y2="180" class="line"/><path d="M220 170l-8 16h16z" fill="#162033"/><text x="235" y="190" class="label">North</text>
<line x1="220" y1="420" x2="394.0" y2="226.8" class="line"/>
<line x1="394.0" y1="226.8" x2="623.8" y2="419.6" class="line"/>
