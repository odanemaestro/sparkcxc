<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
<!--
  Done by: Odane Robinson
  QA fix: the original diagram put M and N on the SAME side of centre O
  (both down-and-right of O, with mismatched slopes), so O, M and N were
  not collinear and M was not even on the circle. Geometry below is solved
  from the given facts (PL diameter, NP tangent at P, angle ONP = 24 deg)
  so that M sits exactly on the circle, on the opposite side of O from N,
  which is what makes angle POM = 114 degrees in the worked solution.
-->
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#162033}
.label{font-size:18px;font-weight:600}
.small{font-size:15px}
.line{stroke:#162033;stroke-width:3;fill:none}
.thin{stroke:#162033;stroke-width:2;fill:none}
</style>
<rect width="900" height="560" fill="white"/>
<circle cx="350" cy="275" r="160" fill="white" stroke="#162033" stroke-width="3"/>
<line x1="350" y1="115" x2="350" y2="435" class="thin"/>
<line x1="203.8" y1="209.9" x2="709.4" y2="435" class="line"/>
<line x1="350" y1="435" x2="709.4" y2="435" class="line"/>
<line x1="350" y1="115" x2="350" y2="435" class="line"/>
<line x1="203.8" y1="209.9" x2="350" y2="435" class="line"/>
<line x1="350" y1="115" x2="203.8" y2="209.9" class="line"/>
<circle cx="350" cy="275" r="3" fill="#162033"/>
<text x="330" y="98" class="label">L</text>
<text x="330" y="460" class="label">P</text>
<text x="368" y="258" class="small">O</text>
<text x="175" y="200" class="label">M</text>
<text x="722" y="458" class="label">N</text>
<text x="602" y="412" class="label" text-anchor="middle">24°</text>
<text x="350" y="50" class="small" text-anchor="middle">PL is a diameter</text>
</svg>
