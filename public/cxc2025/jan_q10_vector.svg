<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
<!--
  Done by: Odane Robinson
  QA fix: the question describes quadrilateral OLMN (4 vertices) with A on
  side LM and B on side MN. The original SVG instead drew a 5-sided
  pentagon O-L-M-N-B, treating B as an extra OUTER corner of the shape
  rather than a point sitting on side MN, and placed the "A" marker at the
  wrong ratio along LM. Both points are now placed exactly on the
  quadrilateral's own sides: A divides LM as LA:AM = 1:2, B divides MN as
  MB:BN = 2:1.
-->
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#162033}
.label{font-size:18px;font-weight:600}
.small{font-size:15px}
.line{stroke:#162033;stroke-width:3;fill:none}
</style>
<rect width="900" height="560" fill="white"/>
<path d="M170 420 L170 145 L520 90 L680 350 Z" fill="#f8fafc" stroke="#162033" stroke-width="3"/>
<line x1="170" y1="420" x2="520" y2="90" class="line"/>
<circle cx="286.7" cy="126.7" r="7" fill="#162033"/>
<circle cx="626.7" cy="263.3" r="7" fill="#162033"/>
<text x="150" y="445" class="label">O</text>
<text x="150" y="135" class="label">L</text>
<text x="525" y="80" class="label">M</text>
<text x="690" y="365" class="label">N</text>
<text x="296" y="118" class="label">A</text>
<text x="636" y="255" class="label">B</text>
<text x="125" y="280" class="label">4y</text>
<text x="362" y="273" class="label" text-anchor="middle">6z</text>
<text x="420" y="430" class="label">2x</text>
</svg>
