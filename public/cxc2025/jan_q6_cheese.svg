<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
<!--
  Done by: Odane Robinson
  QA fix: the original file contained two overlapping sector paths (an old
  broken one plus a "corrected" one that was itself still wrong) - OB
  measured about a third the length of OA, and the actual angle AOB worked
  out to roughly 70 degrees, not the 18 degrees given in the question. The
  wedge below is now built from real trigonometry: OA = OB = 230px and the
  angle between them is exactly 18 degrees.
-->
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#162033}
.label{font-size:18px;font-weight:600}
.small{font-size:15px}
.line{stroke:#162033;stroke-width:3;fill:none}
</style>
<rect width="900" height="560" fill="white"/>
<!-- bottom copy of the wedge (back face), drawn first so the top face overlaps it -->
<path d="M414.0 527.2 L450 300 L486.0 527.2 A230 230 0 0 1 414.0 527.2 Z" fill="#e9edf3" stroke="#162033" stroke-width="2"/>
<!-- side (extrusion) faces -->
<path d="M414.0 327.2 L414.0 527.2 L450 300 L450 100 Z" fill="#eef2f7" stroke="#162033" stroke-width="3"/>
<path d="M486.0 327.2 L486.0 527.2 L450 300 L450 100 Z" fill="#e5eaf1" stroke="#162033" stroke-width="3"/>
<!-- top sector face (the true 18 degree wedge, OA = OB) -->
<path d="M450 100 L414.0 327.2 A230 230 0 0 0 486.0 327.2 Z" fill="#f4f7fb" stroke="#162033" stroke-width="3"/>
<text x="440" y="90" class="label">O</text>
<text x="388" y="330" class="label">A</text>
<text x="498" y="330" class="label">B</text>
<text x="498" y="540" class="label">C</text>
<text x="388" y="540" class="label">D</text>
<text x="450" y="266" class="label" text-anchor="middle">18°</text>
<text x="415" y="230" class="small" text-anchor="end">12 cm</text>
<text x="500" y="430" class="small">8 cm</text>
</svg>
