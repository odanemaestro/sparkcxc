family:Arial,sans-serif;font-size:20px;font-weight:normal;fill:#183b48;text-anchor:middle">A constriction retains the liquid reading.</text><text x="810" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#183b48" style="font-family:Arial,sans-serif;font-size:20px;font-weight:normal;fill:#183b48;text-anchor:middle">It must be reset before another reading.</text></svg>