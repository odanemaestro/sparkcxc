<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" width="1080" height="600"><text x="540" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#183b48" style="font-family:Arial,sans-serif;font-size:28px;font-weight:bold;fill:#183b48;text-anchor:middle">Live electrical contact: keep clear</text><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 524" x="35" y="82" width="470" height="325" preserveAspectRatio="xMidYMid meet"><path d="m300 16 284 492h-568z" fill="#F9A800" stroke-width="32" stroke="#000" stroke-linejoin="round"/><path d="m278 164-50 177 77-41-19 119-16-22 15 72 41-61-23 14 45-164-80 43 59-137"/></svg><text x="270" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#183b48" style="font-family:Arial,sans-serif;font-size:23px;font-weight:bold;fill:#183b48;text-anchor:middle">Electrical shock hazard</text><text x="270" y="503" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#183b48" style="font-family:Arial,sans-serif;font-size:20px;font-weight:normal;fill:#183b48;text-anchor:middle">Contact with a live conductor can</text><text x="270" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#183b48" style="font-family:Arial,sans-serif;font-size:20px;font-weight:normal;fill:#183b48;text-anchor:middle">allow current through the body.</text><text x="810" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#183b48" style="font-family:Arial,sans-serif;font-size:22px;font-weight:bold;fill:#183b48;text-anchor:middle">LIVE CONTACT CAN CAUSE SHOCK</text><text x="810" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#183b48" style="font-family:Arial,sans-serif;font-size:22px;font-weight:bold;fill:#183b48;text-anchor:middle">DO NOT TOUCH THE CASUALTY</text><text x="810" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#183b48" style="font-family:Arial,sans-serif;font-size:23px;font-weight:bold;fill:#183b48;text-anchor:middle">Break the supply first</text><text x="810" y="503" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#183b48" style="font-family:Arial,sans-serif;font-size:20px;font-weight:normal;fill:#183b48;text-anchor:middle">Keep clear of the person and conductor</text><text x="810" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#183b48" style="font-family:Arial,sans-serif;font-size:20px;font-weight:normal;fill:#183b48;text-anchor:middle">until the electrical supply is isolated.</text></svg>