y:Arial,sans-serif;font-size:20px;font-weight:normal;fill:#183b48;text-anchor:middle">A suitable fuse melts or breaker trips.</text><text x="810" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#183b48" style="font-family:Arial,sans-serif;font-size:20px;font-weight:normal;fill:#183b48;text-anchor:middle">The live supply is disconnected.</text></svg>