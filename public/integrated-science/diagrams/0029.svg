</svg><text x="270" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#183b48" style="font-family:Arial,sans-serif;font-size:25px;font-weight:bold;fill:#183b48;text-anchor:middle">Acidic food and bare aluminium</text><text x="270" y="503" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#183b48" style="font-family:Arial,sans-serif;font-size:21px;font-weight:normal;fill:#183b48;text-anchor:middle">Acid can weaken or dissolve the oxide.</text><text x="270" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#183b48" style="font-family:Arial,sans-serif;font-size:21px;font-weight:normal;fill:#183b48;text-anchor:middle">Reaction depends on time and conditions.</text><text x="810" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#183b48" style="font-family:Arial,sans-serif;font-size:25px;font-weight:bold;fill:#183b48;text-anchor:middle">Al₂O₃ + 6H⁺ → 2Al³⁺ + 3H₂O</text><text x="810" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#183b48" style="font-family:Arial,sans-serif;font-size:25px;font-weight:bold;fill:#183b48;text-anchor:middle">Oxide + acid → salt + water</text><text x="810" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#183b48" style="font-family:Arial,sans-serif;font-size:25px;font-weight:bold;fill:#183b48;text-anchor:middle">Loss of protection</text><text x="810" y="503" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#183b48" style="font-family:Arial,sans-serif;font-size:20px;font-weight:normal;fill:#183b48;text-anchor:middle">Exposed aluminium may then react.</text><text x="810" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#183b48" style="font-family:Arial,sans-serif;font-size:20px;font-weight:normal;fill:#183b48;text-anchor:middle">The equation represents oxide dissolution.</text></svg>