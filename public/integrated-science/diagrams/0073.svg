</svg><text x="270" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#183b48" style="font-family:Arial,sans-serif;font-size:22px;font-weight:bold;fill:#183b48;text-anchor:middle">Two connected metals: corrosion reference</text><text x="270" y="503" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#183b48" style="font-family:Arial,sans-serif;font-size:20px;font-weight:normal;fill:#183b48;text-anchor:middle">The less noble metal acts as the anode.</text><text x="270" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#183b48" style="font-family:Arial,sans-serif;font-size:20px;font-weight:normal;fill:#183b48;text-anchor:middle">The source shows a junction, not a coating.</text><text x="810" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#183b48" style="font-family:Arial,sans-serif;font-size:19px;font-weight:bold;fill:#183b48;text-anchor:middle">ZINC: SACRIFICIAL ANODE</text><text x="810" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#183b48" style="font-family:Arial,sans-serif;font-size:19px;font-weight:bold;fill:#183b48;text-anchor:middle">Zn → Zn²⁺ + 2e⁻</text><text x="810" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#183b48" style="font-family:Arial,sans-serif;font-size:19px;font-weight:bold;fill:#183b48;text-anchor:middle">NEARBY IRON IS PROTECTED</text><text x="810" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#183b48" style="font-family:Arial,sans-serif;font-size:22px;font-weight:bold;fill:#183b48;text-anchor:middle">A scratch in galvanised steel</text><text x="810" y="503" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#183b48" style="font-family:Arial,sans-serif;font-size:20px;font-weight:normal;fill:#183b48;text-anchor:middle">Nearby zinc corrodes in preference to iron.</text><text x="810" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#183b48" style="font-family:Arial,sans-serif;font-size:20px;font-weight:normal;fill:#183b48;text-anchor:middle">Protection needs contact and electrolyte.</text></svg>