<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chemistry lab review</title>
<style>
:root{color-scheme:light;--review-paper:#fff;--review-ink:#102a56;--review-muted:#3c526e;--review-border:#cbd9e8;--review-accent:#08766d;--review-bg:#f5f8fb}
html[data-theme=dark]{color-scheme:dark;--review-paper:#101d31;--review-ink:#f3f7ff;--review-muted:#c5d6ec;--review-border:#31445d;--review-accent:#8ee0d6;--review-bg:#091323}
*{box-sizing:border-box}body{margin:0;background:var(--review-bg);color:var(--review-ink);font:15px/1.55 system-ui,sans-serif}main{max-width:1040px;margin:auto;padding:36px 24px}h1{font-size:clamp(26px,4vw,38px);line-height:1.15;letter-spacing:-.025em;margin:0 0 24px}nav{display:flex;align-items:end;gap:12px;flex-wrap:wrap;padding:18px;background:var(--review-paper);border:1px solid var(--review-border);border-radius:14px}nav label{display:grid;gap:6px;flex:1 1 260px;color:var(--review-muted);font-size:13px;font-weight:650}nav button,nav select{font:inherit;font-weight:650;min-height:44px;border-radius:10px;padding:10px 14px;color:var(--review-ink);border:1px solid var(--review-border);background:var(--review-paper);cursor:pointer}nav select{width:100%;font-size:15px;min-width:0}nav button:hover{background:var(--review-bg);border-color:var(--review-accent)}nav button[aria-pressed=true]{color:var(--review-accent);border-color:var(--review-accent)}nav button:focus-visible,nav select:focus-visible{outline:3px solid #0284c7;outline-offset:3px}#lab{width:100%}.review-phone .chem-lab-two,.review-phone .chem-lab-row,.review-phone .chem-lab-grid,.review-phone .chem-electrodes{grid-template-columns:1fr}.review-phone .chem-lab footer{justify-content:stretch}.review-phone .chem-lab-record{width:100%}::selection{background:#b2e8df;color:#102a56}@media(max-width:600px){main{padding:24px 16px}nav{gap:10px;padding:14px}nav label{flex-basis:100%}nav button{flex:1 1 130px;font-size:13px}}
</style></head><body><main><h1>Chemistry lab review</h1><div id="root"></div></main><script type="module" src="/tools/chemistry-lab-preview.jsx"></script></body></html>
